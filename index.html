<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>ASLN — The Discipline System</title><style>
:root{color-scheme:dark;--bg:#090909;--panel:#171717;--line:#303030;--muted:#999;--white:#f5f5f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:15px/1.5 Inter,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1100px;margin:auto;display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:28px 18px}.brand{font-size:27px;font-weight:900;letter-spacing:.22em;margin:0 0 5px}.micro{color:var(--muted);font-size:10px;letter-spacing:.19em;text-transform:uppercase}.nav{display:flex;flex-direction:column;gap:7px;margin-top:36px}.nav button{background:none;border:1px solid transparent;text-align:left;color:#aaa;padding:12px;border-radius:7px}.nav button.active,.nav button:hover{background:#222;color:white;border-color:#353535}.main{padding:34px 42px 90px;min-width:0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.eyebrow{font-size:11px;letter-spacing:.24em;color:#aaa;text-transform:uppercase}h1{font-size:clamp(34px,5vw,62px);letter-spacing:-.055em;line-height:1.03;margin:15px 0}h2{font-size:24px;letter-spacing:-.03em;margin:0 0 14px}h3{font-size:15px;margin:0 0 10px}.muted{color:#aaa}.hero{border:1px solid #343434;background:radial-gradient(ellipse at 85% 0%,#414141 0%,#191919 36%,#101010 75%);border-radius:12px;padding:38px;margin:24px 0}.hero p{max-width:540px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:14px}.metric{font-size:30px;font-weight:800}.bar{height:7px;background:#333;border-radius:12px;overflow:hidden;margin:12px 0}.fill{height:100%;background:#e9e9e9}.btn{border:1px solid #eee;border-radius:6px;background:#eee;color:#111;padding:11px 16px;font-weight:750}.btn.secondary{background:transparent;color:#eee;border-color:#555}.btn:disabled{opacity:.35;cursor:not-allowed}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.task{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #303030}.task:last-child{border:0}.task input{accent-color:#eee;width:18px;height:18px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.tabs button{border:1px solid #444;background:#171717;color:#ddd;border-radius:6px;padding:9px 13px}.tabs button.active{background:#eee;color:#111}.lesson{padding:16px;border-bottom:1px solid #333}.lesson:last-child{border:0}.locked{opacity:.5}.small{font-size:12px}.field{width:100%;padding:12px;background:#101010;border:1px solid #444;border-radius:6px;color:white;margin:7px 0 13px}textarea.field{min-height:95px;resize:vertical}.notice{border-left:2px solid #aaa;padding:12px 16px;background:#1b1b1b;color:#bbb;margin:18px 0}.mobilebar{display:none}.badge{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#aaa}.section{margin-top:28px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}ul{padding-left:20px}li{margin:8px 0}@media(max-width:760px){.shell{display:block}.side{display:none}.main{padding:22px 17px 105px}.hero{padding:25px 20px}.grid,.two{grid-template-columns:1fr}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #333;z-index:4;justify-content:space-around;padding:8px 2px max(10px,env(safe-area-inset-bottom))}.mobilebar button{border:0;background:none;color:#aaa;font-size:10px;padding:8px 3px}.mobilebar button.active{color:white}.mobilebar span{display:block;font-size:19px}.top{align-items:flex-start}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">ASLN</div><div class="micro">The Discipline System</div><div class="nav" id="desktopNav"></div><p class="micro" style="margin-top:45px">90 DAYS. ONE MISSION.</p></aside><main class="main"><div class="top"><div class="eyebrow">ASLN / THE DISCIPLINE SYSTEM</div><div class="badge" id="dayBadge"></div></div><div id="view"></div></main></div><div class="mobilebar" id="mobileNav"></div><script>
const KEY='asln-v1';const initial={started:null,checks:{},goals:'',reflection:{},workouts:{},weight:{},profile:{},lessonNotes:{}};let state;try{state={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state={...initial}};let page='home',trainingTab='gym',nutritionTab='principles';const nav=[['home','⌂','Home'],['daily','✓','Daily'],['lessons','◫','90 Days'],['training','▣','Training'],['nutrition','◉','Nutrition'],['performance','↗','Progress'],['reset','↻','Reset']];const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const dateKey=()=>new Date().toLocaleDateString('en-CA');const day=()=>state.started?Math.min(90,Math.max(1,Math.floor((Date.now()-new Date(state.started+'T00:00:00').getTime())/86400000)+1)):0;const phase=d=>d<=30?'BREAK THE OLD YOU':d<=60?'BUILD THE NEW YOU':'BECOME THE MAN';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const lessons=[];
const themes=[['Audit Your Life','Identify what is holding you back.','Write down three habits you will stop feeding.'],['Own the Morning','Your first hour sets the tone.','Plan tomorrow morning before going to bed.'],['Keep Your Word','Self-trust is built through action.','Make one small promise and complete it.'],['Remove Friction','Environment beats motivation.','Remove one obvious distraction from your workspace.'],['Move With Purpose','Physical effort strengthens consistency.','Complete your scheduled workout or a 20-minute walk.'],['Control Your Attention','Attention is a finite resource.','Work uninterrupted on one priority for 25 minutes.'],['Review Without Excuses','Measure behavior, not intentions.','Record one win and one adjustment.'],['Choose Discomfort','Growth often feels inconvenient.','Do the useful task you have been avoiding.'],['Build a Routine','Repeatable systems reduce decisions.','Set fixed times for sleep, movement, and planning.'],['Practice Restraint','You can choose your response.','Pause for ten seconds before reacting to frustration.'],['Think Long Term','Trade short rewards for durable results.','Write a one-year goal and today’s next step.'],['Protect Your Energy','Recovery supports performance.','Plan a consistent sleep window tonight.'],['Eat Deliberately','Food is fuel, not punishment.','Prepare one balanced meal without distractions.'],['Do the Hard Thing First','Priorities should not wait for spare time.','Complete your highest-impact task before entertainment.'],['Rebuild Self-Respect','Confidence follows evidence.','List three actions you completed this week.']];for(let i=1;i<=90;i++){const t=themes[(i-1)%themes.length];const phaseNum=Math.ceil(i/30);lessons.push({day:i,title:phaseNum===1?t[0]:phaseNum===2?`${t[0]} — Practice`:`${t[0]} — Mastery`,idea:t[1],action:phaseNum===1?t[2]:phaseNum===2?`${t[2]} Repeat it for two consecutive days and note what changed.`:`${t[2]} Define how you will sustain this for the next 30 days.`})}
function navRender(){document.getElementById('desktopNav').innerHTML=nav.map(([id,icon,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${icon} &nbsp; ${label}</button>`).join('');document.getElementById('mobileNav').innerHTML=nav.filter(x=>['home','daily','lessons','training','performance'].includes(x[0])).map(([id,icon,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span>${icon}</span>${label}</button>`).join('');document.getElementById('dayBadge').textContent=state.started?`DAY ${day()} / 90`:'NOT STARTED'}function go(p){page=p;render();window.scrollTo(0,0)}function start(){state.started=dateKey();save();go('daily')}function completed(){return Object.values(state.checks).filter(Boolean).length}function tasks(d=day()){return ['Read today’s lesson','Complete the daily action','Move your body','Eat with intention','Plan tomorrow'].map((x,i)=>({id:`${d}-${i}`,text:x}))}function taskHTML(d=day()){return tasks(d).map(t=>`<label class="task"><input type="checkbox" ${state.checks[t.id]?'checked':''} onchange="check('${t.id}',this.checked)"><span>${t.text}</span></label>`).join('')}function check(k,v){state.checks[k]=v;save();render()}function heading(k,title,sub=''){return `<div class="section"><div class="eyebrow">${k}</div><h1>${title}</h1><p class="muted">${sub}</p></div>`}function render(){navRender();let html='';let d=day();if(page==='home'){html=`<section class="hero"><div class="eyebrow">90 DAYS · ONE MISSION</div><h1>BUILD THE MAN<br>YOU RESPECT.</h1><p class="muted">Discipline is not a feeling. It is a system of actions you repeat, especially when you do not feel like it.</p><button class="btn" onclick="${d?"go('daily')":"start()"}">${d?'Continue Day '+d:'Begin Your 90 Days'} →</button></section><div class="grid"><div class="card"><div class="micro">Current day</div><div class="metric">${d||'—'} <span class="muted small">/ 90</span></div></div><div class="card"><div class="micro">Daily tasks done</div><div class="metric">${d?tasks(d).filter(t=>state.checks[t.id]).length:0} <span class="muted small">/ 5</span></div></div><div class="card"><div class="micro">Total tasks done</div><div class="metric">${completed()}</div></div></div><div class="section two"><div class="card"><h2>Today's mission</h2><p>${d?esc(lessons[d-1].title):'Your journey starts with one decision.'}</p><button class="btn secondary" onclick="go('daily')">Open daily execution →</button></div><div class="card"><h2>The three phases</h2><p class="muted">01 — Break the Old You · Days 1–30<br>02 — Build the New You · Days 31–60<br>03 — Become the Man · Days 61–90</p></div></div>`}else if(page==='daily'){html=heading('DAILY EXECUTION',d?`DAY ${String(d).padStart(2,'0')}`:'YOUR FIRST DAY',d?phase(d):'Start the program from Home to unlock your daily lesson.');if(d){const l=lessons[d-1];html+=`<div class="card"><div class="eyebrow">TODAY'S LESSON</div><h2>${esc(l.title)}</h2><p>${esc(l.idea)}</p><div class="notice"><strong>Today's action:</strong> ${esc(l.action)}</div><label class="micro" for="note">YOUR NOTES</label><textarea class="field" id="note" placeholder="What did you learn?" oninput="state.lessonNotes[${d}]=this.value;save()">${esc(state.lessonNotes[d]||'')}</textarea></div><div class="card"><h2>Execution checklist</h2>${taskHTML()}</div>`}}else if(page==='lessons'){html=heading('THE CURRICULUM','90 DAYS. ONE MISSION.','One new lesson unlocks each day. Previous lessons stay available.');if(!d)html+='<div class="notice">Start your program on Home to unlock Day 1.</div>';for(let phaseIndex=0;phaseIndex<3;phaseIndex++){html+=`<div class="section"><h2>0${phaseIndex+1} — ${phase(phaseIndex*30+1)}</h2><div class="card">`;for(let i=phaseIndex*30;i<phaseIndex*30+30;i++){let l=lessons[i],locked=!d||l.day>d;html+=`<div class="lesson ${locked?'locked':''}"><div class="row"><strong>DAY ${String(l.day).padStart(2,'0')} · ${esc(l.title)}</strong><span class="badge">${locked?'LOCKED':'OPEN'}</span></div>${!locked?`<p class="muted">${esc(l.idea)}</p><p><strong>Action:</strong> ${esc(l.action)}</p>`:''}</div>`}html+='</div></div>'}}else if(page==='training'){html=heading('PHYSICAL FOUNDATION','TRAIN WITH PURPOSE.','Choose a sustainable routine. Progress comes from consistency and recovery.');html+=`<div class="tabs">${[['gym','Gym · 3 days'],['home','Home · 3 days']].map(([id,label])=>`<button class="${trainingTab===id?'active':''}" onclick="trainingTab='${id}';render()">${label}</button>`).join('')}</div>`;const gym=[['DAY A · FULL BODY','Squat 3×6–10','Bench press or push-ups 3×6–12','Seated row 3×8–12','Plank 3×30–45 sec'],['DAY B · FULL BODY','Romanian deadlift 3×8–10','Overhead press 3×6–10','Lat pulldown 3×8–12','Split squat 2×8–10/leg'],['DAY C · FULL BODY','Leg press 3×10–12','Incline dumbbell press 3×8–12','Cable row 3×8–12','Hamstring curl 3×10–15']];const home=[['DAY A · FULL BODY','Bodyweight squat 3×10–20','Push-up (incline if needed) 3×6–15','Backpack row 3×10–15','Plank 3×20–45 sec'],['DAY B · FULL BODY','Reverse lunge 3×8–12/leg','Pike push-up 3×5–10','Glute bridge 3×12–20','Side plank 2×20–40 sec/side'],['DAY C · FULL BODY','Tempo squat 3×10–15','Push-up 3×6–15','Backpack Romanian deadlift 3×10–15','Dead bug 3×8–12/side']];html+=(trainingTab==='gym'?gym:home).map((a,i)=>`<div class="card"><div class="row"><h2>${a[0]}</h2><label><input type="checkbox" ${state.workouts[`${dateKey()}-${trainingTab}-${i}`]?'checked':''} onchange="state.workouts['${dateKey()}-${trainingTab}-${i}']=this.checked;save()"> Done</label></div><ul>${a.slice(1).map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('');html+='<div class="notice">Train on non-consecutive days when possible. Warm up 5–10 minutes, use controlled technique, and stop if you feel sharp pain. Choose a load that leaves 1–3 repetitions in reserve. Add repetitions or weight gradually.</div>'}else if(page==='nutrition'){html=heading('NUTRITION FOUNDATION','FUEL THE WORK.','Practical guidance, not restrictive rules.');html+=`<div class="tabs">${[['principles','Principles'],['calculator','Macro estimator'],['meals','Meal examples']].map(([id,label])=>`<button class="${nutritionTab===id?'active':''}" onclick="nutritionTab='${id}';render()">${label}</button>`).join('')}</div>`;if(nutritionTab==='principles')html+=`<div class="card"><h2>Build a repeatable nutrition system</h2><ul><li>Include a protein source in each main meal.</li><li>Eat vegetables and fruit daily; aim for varied colors.</li><li>Choose fiber-rich foods such as oats, beans, potatoes and whole grains.</li><li>Drink water regularly, especially during physical activity.</li><li>Adjust portions to your energy needs and goal; avoid extreme restriction.</li><li>Use weekly trends rather than one day of scale weight.</li></ul></div>`;if(nutritionTab==='calculator')html+=`<div class="card"><h2>Daily energy estimate</h2><p class="muted small">A rough starting point for adults, not a medical or individualized prescription.</p><label>Body weight (kg)<input class="field" id="kg" type="number" min="35" max="300" value="80"></label><label>Activity<select class="field" id="activity"><option value="28">Low</option><option value="32" selected>Moderate</option><option value="36">High</option></select></label><label>Goal<select class="field" id="goal"><option value="-300">Gradual fat loss</option><option value="0" selected>Maintain</option><option value="200">Gradual gain</option></select></label><button class="btn" onclick="estimate()">Calculate</button><div id="estimate" class="notice">Your estimate will appear here.</div></div>`;if(nutritionTab==='meals')html+=`<div class="grid"><div class="card"><h3>BREAKFAST</h3><p>Eggs, whole-grain toast, fruit and yogurt.</p></div><div class="card"><h3>LUNCH</h3><p>Chicken, potatoes, mixed vegetables and olive oil.</p></div><div class="card"><h3>DINNER</h3><p>Lean beef or lentils, rice and a large salad.</p></div></div><div class="notice">Portions depend on your needs. Food allergies, medical conditions and dietary restrictions may require professional advice.</div>`}else if(page==='performance'){html=heading('PERFORMANCE','MEASURE THE WORK.','Track what you can control.');let doneDays=Array.from({length:d},(_,i)=>tasks(i+1).filter(t=>state.checks[t.id]).length===5).filter(Boolean).length;html+=`<div class="grid"><div class="card"><div class="micro">Completed tasks</div><div class="metric">${completed()}</div></div><div class="card"><div class="micro">Perfect days</div><div class="metric">${doneDays}</div></div><div class="card"><div class="micro">Program progress</div><div class="metric">${Math.round(d/90*100)}%</div></div></div><div class="card"><h2>90-day progress</h2><div class="bar"><div class="fill" style="width:${d/90*100}%"></div></div><p class="muted">${d} of 90 days unlocked</p></div><div class="card"><h2>Your main goal</h2><textarea class="field" placeholder="What are you working toward?" oninput="state.goals=this.value;save()">${esc(state.goals)}</textarea></div><div class="card"><h2>Weight log (optional)</h2><p class="muted small">Weight is only one metric. Record it if it is useful to you.</p><input class="field" id="weight" type="number" min="20" max="400" step="0.1" placeholder="Weight in kg" value="${esc(state.weight[dateKey()]||'')}"><button class="btn secondary" onclick="state.weight[dateKey()]=document.getElementById('weight').value;save();render()">Save today's weight</button><p class="muted small">Entries recorded: ${Object.values(state.weight).filter(Boolean).length}</p></div>`}else if(page==='reset'){html=heading('WEEKLY REVIEW','SUNDAY RESET.','Reflect. Adjust. Execute again.');let key=`${new Date().getFullYear()}-W${Math.ceil((Date.now()-new Date(new Date().getFullYear(),0,1))/604800000)}`;let answers=state.reflection[key]||{};html+=`<div class="card"><h2>Your weekly review</h2>${[['win','What went well this week?'],['friction','What held you back?'],['change','What will you change next week?'],['priority','What is your single highest priority?']].map(([k,q])=>`<label><strong>${q}</strong><textarea class="field" oninput="updateReflection('${key}','${k}',this.value)">${esc(answers[k]||'')}</textarea></label>`).join('')}<p class="muted small">Your answers save automatically in this browser.</p></div>`}document.getElementById('view').innerHTML=html}function updateReflection(w,k,v){state.reflection[w]??={};state.reflection[w][k]=v;save()}function estimate(){let kg=Number(document.getElementById('kg').value),a=Number(document.getElementById('activity').value),g=Number(document.getElementById('goal').value);if(!kg||kg<35||kg>300)return;let cal=Math.round((kg*a+g)/50)*50;document.getElementById('estimate').innerHTML=`Estimated starting intake: <strong>${cal.toLocaleString()} kcal/day</strong><br>Protein reference range: <strong>${Math.round(kg*1.2)}–${Math.round(kg*1.8)} g/day</strong> for many active adults. Monitor energy, recovery and trends; adjust as needed.`}render();
</script></body></html>
